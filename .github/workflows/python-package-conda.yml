name: Python dashboard checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies and test tools
        run: python -m pip install -r requirements.txt pytest httpx flake8
      - name: Check syntax and undefined names
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run isolated dashboard regressions
        run: python -m pytest tests -q
